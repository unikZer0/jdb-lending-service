services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: apiservice
      POSTGRES_PASSWORD: apiservice123
      POSTGRES_DB: apiservice_db
    ports:
      - 5432:5432
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U apiservice"]
      interval: 5s
      timeout: 5s
      retries: 5

  apiservicewithjdb:
    image: apiservicewithjdb
    build:
      context: .
      dockerfile: ./Dockerfile
    ports:
      - 8080:8080
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - .env
    environment:
      DB_HOST: postgres

volumes:
  postgres_data:
